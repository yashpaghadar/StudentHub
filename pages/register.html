    <!-- ====================== REGISTER FORM ====================== -->

    <section class="py-5 bg-light">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-xl-6">
            <div class="card border-0 shadow-lg rounded-4">
              <div class="card-body p-5">
                <!-- Form Header -->

                <div class="text-center mb-4">
                  <img
                    src="../img/logo.png"
                    width="90"
                    class="mb-3"
                    alt="StudentHub Logo"
                  />

                  <h2 class="fw-bold">StudentHub</h2>

                  <p class="text-muted">Create a New Student Account</p>

                  <hr />
                </div>

                <!-- ================= FORM ================= -->

                <form id="registerForm" novalidate>
                  <!-- Full Name -->

                  <div class="mb-4">
                    <label for="fullName" class="form-label fw-semibold">
                      Full Name
                    </label>

                    <div class="input-group">
                      <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        class="form-control"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        aria-describedby="nameError"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-person"></i>
                      </span>
                    </div>

                    <div
                      id="nameError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Enrollment Number -->

                  <div class="mb-4">
                    <label for="enrollment" class="form-label fw-semibold">
                      Enrollment Number
                    </label>

                    <div class="input-group">
                      <input
                        type="text"
                        id="enrollment"
                        name="enrollment"
                        class="form-control"
                        placeholder="Enter your enrollment number"
                        aria-describedby="enrollmentError"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-person-vcard"></i>
                      </span>
                    </div>

                    <div
                      id="enrollmentError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Email -->

                  <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">
                      Email Address
                    </label>

                    <div class="input-group">
                      <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        aria-describedby="emailError"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                      </span>
                    </div>

                    <div
                      id="emailError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Mobile Number -->

                  <div class="mb-4">
                    <label for="mobile" class="form-label fw-semibold">
                      Mobile Number
                    </label>

                    <div class="input-group">
                      <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        class="form-control"
                        placeholder="Enter 10-digit mobile number"
                        inputmode="numeric"
                        maxlength="10"
                        aria-describedby="mobileError"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-phone"></i>
                      </span>
                    </div>

                    <div
                      id="mobileError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Password -->

                  <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                      Password
                    </label>

                    <div class="input-group">
                      <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        aria-describedby="passwordError passwordStrength"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                      </span>
                    </div>

                    <div
                      id="passwordStrength"
                      class="small mt-2"
                      aria-live="polite"
                    ></div>

                    <div
                      id="passwordError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Confirm Password -->

                  <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">
                      Confirm Password
                    </label>

                    <div class="input-group">
                      <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        aria-describedby="confirmPasswordError"
                        required
                      />

                      <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                      </span>
                    </div>

                    <div
                      id="confirmPasswordError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Course -->

                  <div class="mb-4">
                    <label for="course" class="form-label fw-semibold">
                      Course
                    </label>

                    <select
                      id="course"
                      name="course"
                      class="form-select"
                      aria-describedby="courseError"
                      required
                    >
                      <option value="" selected disabled>
                        Select your course
                      </option>

                      <option value="B.Tech IT">
                        B.Tech Information Technology
                      </option>

                      <option value="B.Tech CSE">
                        B.Tech Computer Science
                      </option>

                      <option value="BCA">
                        Bachelor of Computer Applications
                      </option>

                      <option value="MCA">
                        Master of Computer Applications
                      </option>

                      <option value="Diploma IT">
                        Diploma Information Technology
                      </option>
                    </select>

                    <div
                      id="courseError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Year -->

                  <div class="mb-4">
                    <label for="year" class="form-label fw-semibold">
                      Year
                    </label>

                    <select
                      id="year"
                      name="year"
                      class="form-select"
                      aria-describedby="yearError"
                      required
                    >
                      <option value="" selected disabled>
                        Select your year
                      </option>

                      <option value="1">First Year</option>
                      <option value="2">Second Year</option>
                      <option value="3">Third Year</option>
                      <option value="4">Fourth Year</option>
                    </select>

                    <div
                      id="yearError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Gender -->

                  <div class="mb-4">
                    <label class="form-label fw-semibold"> Gender </label>

                    <div
                      class="d-flex gap-4"
                      role="radiogroup"
                      aria-label="Gender"
                    >
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          id="male"
                          value="Male"
                        />

                        <label class="form-check-label" for="male">
                          Male
                        </label>
                      </div>

                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          id="female"
                          value="Female"
                        />

                        <label class="form-check-label" for="female">
                          Female
                        </label>
                      </div>

                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          id="other"
                          value="Other"
                        />

                        <label class="form-check-label" for="other">
                          Other
                        </label>
                      </div>
                    </div>

                    <div
                      id="genderError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Terms -->

                  <div class="mb-4">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="agree"
                        name="agree"
                        aria-describedby="termsError"
                        required
                      />

                      <label class="form-check-label" for="agree">
                        I agree to the

                        <a href="#" class="text-decoration-none">
                          Terms &amp; Conditions
                        </a>

                        and

                        <a href="#" class="text-decoration-none">
                          Privacy Policy
                        </a>
                      </label>
                    </div>

                    <div
                      id="termsError"
                      class="text-danger small mt-1"
                      aria-live="polite"
                    ></div>
                  </div>

                  <!-- Register Button -->

                  <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-primary fw-semibold">
                      <i class="bi bi-person-plus me-2"></i>
                      Register
                    </button>
                  </div>

                  <!-- Divider -->

                  <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1" />

                    <span class="px-3 text-muted"> OR </span>

                    <hr class="flex-grow-1" />
                  </div>

                  <!-- Login -->

                  <div class="text-center">
                    <p class="mb-0">
                      Already have an account?

                      <a
                        href="login.html"
                        class="fw-semibold text-decoration-none"
                      >
                        Login here
                      </a>
                    </p>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
