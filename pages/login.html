    <link rel="stylesheet" href="../css/style.css" />

            <small class="text-light"> Login Page </small>
          </div>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="../index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html"> About </a>

            <li class="nav-item">

            <li class="nav-item ms-lg-3">
              <a class="btn btn-warning me-2 " href="login.html"> Login </a>

            <li class="nav-item">
              <a class="btn btn-warning" href="register.html"> Register </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ====================== LOGIN SECTION ====================== -->

    <section class="py-5 bg-light">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg rounded-4">
              <div class="card-body p-5">
                <div class="text-center mb-4">
                  <img
                    src="../img/logo.png"
                    alt="Logo"
                    width="80"
                    class="mb-3"
                  />

                  <h2 class="fw-bold">Login to Your Account</h2>

                  <p class="text-muted">Welcome back to StudentHub</p>

                  <hr />
                </div>

                <form>
                  <!-- Email -->

                  <div class="mb-4">
                    <label class="form-label fw-semibold">
                      Email / Username
                    </label>

                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                      </span>

                      <input
                        type="email"
                        class="form-control"
                        placeholder="Enter your email or username"
                        required
                      />
                    </div>
                  </div>
                  <!-- Password -->

                  <div class="mb-4">
                    <label class="form-label fw-semibold"> Password </label>

                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                      </span>

                      <input
                        type="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                      />
                    </div>
                  </div>

                  <!-- Remember Me & Forgot Password -->

                  <div
                    class="d-flex justify-content-between align-items-center mb-4"
                  >
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                      />

                      <label class="form-check-label" for="rememberMe">
                        Remember Me
                      </label>
                    </div>

                    <a href="#" class="text-decoration-none">
                      Forgot Password?
                    </a>
                  </div>

                  <!-- Login Button -->

                  <div class="d-grid mb-4">
                    <button
                      type="submit"
                      class="btn btn-primary fw-semibold"
                    >
                      Login
                    </button>
                  </div>

                  <!-- Divider -->

                  <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1" />

                    <span class="px-3 text-muted"> OR </span>

                    <hr class="flex-grow-1" />
                  </div>

                  <!-- Register Link -->

                  <div class="text-center">
                    <p class="mb-0">
                      Don't have an account?

                      <a
                        href="register.html"
                        class="fw-semibold text-decoration-none"
                      >
                        Register
                      </a>
                    </p>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ====================== FOOTER ====================== -->

    <footer class="student-footer">
